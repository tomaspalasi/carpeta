<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <script>
      // Redirect to index.html for client-side routing
      var path = window.location.pathname;
      if (path !== '/portfolio/' && path !== '/portfolio/index.html') {
        sessionStorage.redirect = path;
        window.location.href = '/portfolio/';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/portfolio/src/main.tsx"></script>
  </body>
</html>
